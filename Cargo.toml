[package]
authors = [
    "Marc Brinkmann <git@marcbrinkmann.de>",
    "Denys Vitali <denys@denv.it>",
]
name = "poppler"
license = "GPL-2.0"
version = "0.6.0"
description = "Wrapper for the GPL-licensed Poppler PDF rendering library."
repository = "https://github.com/DMSrs/poppler-rs"
edition = "2018"

[features]
render = ["dep:cairo-rs"]

[dependencies]
anyhow = ">=1.0"
cairo-rs = { version = ">=0.21", features = ["png", "pdf"], optional = true }
glib = ">=0.21"
gobject-sys = ">=0.21"
unicode-bidi = ">=0.3"

[build-dependencies]
cc = ">=1.2"
pkg-config = ">=0.3"
